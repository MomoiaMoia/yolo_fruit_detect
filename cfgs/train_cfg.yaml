trainer:
  device: 'cuda'
  # pretrained: null
  # freeze: null
  pretrained: pts/yolov12n.pt
  freeze: 0
  lr: 0.001
  lrf: 0.01
  lr_finetune: 0.001
  wd: 0.
  dropout: 0.0
  cos_lr: False
  betas: [0.9, 0.999]
  epochs: 400
  close_mosaic: 40
  log_dir: 'logs'
  ckpt_dir: 'ckpts'

  use_ema: True
  ema_decay: 0.9999

  metric_every: 20
  save_every: 50

dataset:
  names:
    0: ripe
  # root_dir: 'strawberry_cls'
  root_dir: 'data/blueberry_cls_v4'
  batch_size: 8
  num_workers: 8

augmentation:
  imgsz: 160
  # hsv: 0.015, 0.7, 0.4
  # scale: 0.5
  hsv_h: 0.015 # (float) image HSV-Hue augmentation (fraction)
  hsv_s: 0.3 # (float) image HSV-Saturation augmentation (fraction) - 降低
  hsv_v: 0.2 # (float) image HSV-Value augmentation (fraction) - 降低
  degrees: 0.0 # (float) image rotation (+/- deg)
  translate: 0.1 # (float) image translation (+/- fraction)
  scale: 0.3 # (float) image scale (+/- gain) - 降低，蓝莓大小相对固定
  shear: 0.0 # (float) image shear (+/- deg)
  perspective: 0.0 # (float) image perspective (+/- fraction), range 0-0.001
  flipud: 0.0 # (float) image flip up-down (probability)
  fliplr: 0.5 # (float) image flip left-right (probability)
  bgr: 0.0 # (float) image channel BGR (probability)

  # mosaic: 1.0
  mosaic: 0.3 # (float) image mosaic (probability) - 降低，保留上下文信息
  mixup: 0.0 # (float) image mixup (probability)
  # copy_paste: 0.1
  copy_paste: 0.0 # (float) segment copy-paste (probability) - 关闭，避免学习到错误的背景泛化

  copy_paste_mode: "flip" # (str) the method to do copy_paste augmentation (flip, mixup)
  auto_augment: randaugment # (str) auto augmentation policy for classification (randaugment, autoaugment, augmix)
  # erasing: 0.4
  erasing: 0.1 # (float) probability of random erasing - 降低，减少特征丢失
  crop_fraction: 1.0 # (float) image crop fraction for classification (0.1-1), 1.0 means no crop, must be greater than 0.